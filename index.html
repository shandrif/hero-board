<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Board · Weekly Hero Products</title>
<meta name="description" content="Weekly hero products for Half Million stores.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-title" content="Hero Board">
<link rel="stylesheet" href="style.css?v=22">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=22"></script>
<script src="common.js?v=22"></script>
</head>
<body>
<div id="splash" role="status" aria-label="Loading Hero Board">
  <div class="sp-box"><img class="sp-logo" src="icon.svg" alt=""><div class="sp-name">Hero Board</div><div class="sp-bar"><i></i></div></div>
</div>

<!-- SIGN IN (admin and stores) -->
<section id="loginView" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><img class="logo lg" src="icon.svg" alt="Hero Board"><div><b>Hero Board</b><small>Weekly hero products</small></div></div>
    <h1>Sign in</h1>
    <p>Use the User ID and password your admin gave you.</p>
    <label for="lCode">User ID</label>
    <input id="lCode" placeholder="e.g. HM001" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="lPass">Password</label>
    <input id="lPass" type="password" autocomplete="current-password" required>
    <button class="btn block" type="submit" id="lBtn" style="margin-top:20px">Sign in</button>
    <div class="err" id="lErr"></div>
    <p class="note" style="margin:6px 0 0">Forgot your password? Ask your admin to reset it.</p>
  </form>
</section>

<!-- STORE APP -->
<div id="shell" class="hidden">
  <div class="mobile-top"><div class="brand"><img class="logo" src="icon.svg" alt=""><div><b>Hero Board</b><small id="mStore"></small></div></div><button class="logoutBtn">Sign out</button></div>
  <div id="app">
    <aside>
      <div class="brand"><img class="logo" src="icon.svg" alt=""><div><b>Hero Board</b><small>Weekly hero products</small></div></div>
      <nav id="nav"></nav>
      <div class="me"><b id="meName"></b><span id="meCode"></span><br><button class="logoutBtn">Sign out</button></div>
    </aside>
    <main id="main">
      <div class="new-flag" id="newFlag">Something new is here! Please review and acknowledge.</div>
      <div id="content"></div>
    </main>
  </div>
  <div class="bottom-nav" id="bnav"></div>
</div>

<script src="motion.js?v=22"></script>
<script>
let token = storageGet("hb_store_token"), D = null, lastWeek = storageGet("hb_last_week"), view = "heroes";
const BASE = location.href.replace(/[^/]*([?#].*)?$/, "");
const VIEWS = [["heroes", "This week", ICON.star], ["updates", "Updates", ICON.bell], ["staff", "Staff", ICON.users]];
const pendingUpdates = () => (D.updates || []).filter(u => !u.ack);

// ---------- sign in ----------
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#lErr").textContent = ""; $("#lBtn").disabled = true; $("#lBtn").textContent = "Signing in…";
  const done = () => { $("#lBtn").disabled = false; $("#lBtn").textContent = "Sign in"; };
  const id = $("#lCode").value.trim();
  if (id.toLowerCase() === "admin") {
    const { error: aErr } = await sb.auth.signInWithPassword({ email: "admin@heroboard.app", password: $("#lPass").value });
    if (aErr) { done(); return ($("#lErr").textContent = aErr.message === "Invalid login credentials" ? "Wrong User ID or password." : aErr.message); }
    return location.replace("admin.html");
  }
  const { data, error } = await sb.rpc("hb_store_login", { p_code: id, p_password: $("#lPass").value });
  done();
  if (error || data.error) return ($("#lErr").textContent = error ? errMsg(error) : data.error);
  token = data.token; storageSet("hb_store_token", token); start();
};
document.querySelectorAll(".logoutBtn").forEach(b => b.onclick = async () => {
  b.disabled = true; b.textContent = "Signing out…";
  try { await Promise.race([sb.rpc("hb_store_logout", { p_token: token }), new Promise(r => setTimeout(r, 3000))]); } catch {}
  storageSet("hb_store_token", null); location.replace(location.pathname);
});

function showLogin(msg) { $("#shell").classList.add("hidden"); $("#loginView").classList.remove("hidden"); $("#lErr").textContent = msg || ""; hideSplash(); }

let started = false;
async function start() {
  const msg = new URLSearchParams(location.search).get("m");
  if (!token) {
    if (new URLSearchParams(location.search).has("out")) { clearAdminLogin(); history.replaceState(null, "", location.pathname); }
    const { data: s } = await sb.auth.getSession();
    if (s.session && !msg && !new URLSearchParams(location.search).has("store")) return location.replace("admin.html");
    return showLogin(msg === "notadmin" ? "This account is not a Hero Board admin." : "");
  }
  const ok = await load();
  if (!ok) return;
  $("#loginView").classList.add("hidden"); $("#shell").classList.remove("hidden");
  hideSplash();
  if (!started) { started = true; liveConnect(["hb-all", "hb-store-" + D.store.code], load); go(view, true); }
}
async function load() {
  const { data, error } = await sb.rpc("hb_store_home", { p_token: token });
  if (error) {
    if (String(error.message).includes("SESSION_EXPIRED")) { storageSet("hb_store_token", null); token = null; showLogin("Please sign in again."); return false; }
    if (!D) {   // still signed in, just couldn't load (weak connection): offer a retry instead of the sign-in screen
      hideSplash();
      $("#loginView").classList.add("hidden");
      let box = $("#loadFail");
      if (!box) { box = document.createElement("div"); box.id = "loadFail"; box.className = "panel empty"; box.style.cssText = "max-width:420px;margin:80px auto"; document.body.appendChild(box); }
      box.innerHTML = `<h2 style="margin-bottom:6px">Couldn't load</h2>${esc(errMsg(error))}<div style="margin-top:14px"><button class="btn" id="loadRetry">Try again</button></div>`;
      $("#loadRetry").onclick = () => location.reload();
    } else toast(errMsg(error), "bad");
    return !!D;
  }
  const isNew = data.week && String(data.week.id) !== lastWeek;
  if (D && isNew) view = "heroes";
  D = data;
  HB_MEDIA = { auth: { store_token: token }, label: `${D.store.name} · ${D.store.code}` };
  if (document.activeElement && document.activeElement.id === "totalIn") return true; // don't wipe what they're typing
  renderNav(); render();
  $("#newFlag").classList.toggle("show", !!(data.week && !data.ack) || (data.updates || []).some(u => !u.ack));
  if (data.week) { lastWeek = String(data.week.id); storageSet("hb_last_week", lastWeek); }
  return true;
}

// ---------- navigation ----------
function renderNav() {
  $("#meName").textContent = D.store.name; $("#meCode").textContent = "Store ID " + D.store.code; $("#mStore").textContent = D.store.name;
  const pending = D.week && !D.ack;
  const nu = pendingUpdates().length;
  const html = VIEWS.map(([k, label, icon]) => `<button data-v="${k}" class="${k === view ? "on" : ""}">${icon}<span>${label}</span>${k === "heroes" && pending ? `<span class="badge">!</span>` : ""}${k === "updates" && nu ? `<span class="badge">${nu}</span>` : ""}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.remove());
  $("#nav").insertAdjacentHTML("beforeend", html);
  $("#bnav").innerHTML = html.replace(/<span class="badge">!<\/span>/g, '<span class="badge-n">!</span>').replace(/<span class="badge">(\d+)<\/span>/g, '<span class="badge-n">$1</span>');
  document.querySelectorAll("#nav button, #bnav button").forEach(b => b.onclick = () => go(b.dataset.v));
  slideIndicator($("#nav"), "nav");
}
function go(v, quiet) {
  view = v; renderNav(); render();
  $("#main").scrollTop = 0;
  if (!quiet) animateEnter($("#content"));
}

function staffLink(v) { return `${BASE}staff.html?k=${D.store.link_key}${v ? "&v=" + v : ""}`; }
function waStaffHref(subject, v) {
  const msg = `*${subject}* – ${D.store.name}\n\nPlease open this link, read or watch everything and tap "I'm aware":\n${staffLink(v)}`;
  return "https://wa.me/?text=" + encodeURIComponent(msg);
}
// ---------- Staff tab: separate lists for hero products and for updates ----------
let staffMode = "heroes";
function staffSeg() {
  const nu = (D.updates || []).filter(u => u.require_staff).length;
  return `<div class="seg" id="sMode" role="tablist"><button data-m="heroes" class="${staffMode === "heroes" ? "on" : ""}">Hero products</button><button data-m="updates" class="${staffMode === "updates" ? "on" : ""}">Updates${nu ? ` (${nu})` : ""}</button></div>`;
}
function bindStaffSeg() { document.querySelectorAll("#sMode button").forEach(b => b.onclick = () => { if (staffMode === b.dataset.m) return; staffMode = b.dataset.m; render(); animateEnter($("#content")); }); }
function staffListHTML(list) {
  return list.length ? `<ul class="list">${list.map(s => `<li><span><b>${esc(s.staff_name)}</b> <span class="muted small mono">${esc(s.employee_id)}</span></span><span class="muted small">${fmtDateTime(s.acked_at)}</span></li>`).join("")}</ul>` : `<p class="empty">No staff have confirmed yet.</p>`;
}
function renderStaffUpdates() {
  const total = D.store.total_staff || 0, list = D.updates || [];
  $("#content").innerHTML = `
    <div class="top"><div><h1>Staff sign-off</h1><p>Updates · ${esc(D.store.name)}</p></div><span class="live"><i></i>Live</span></div>
    ${staffSeg()}
    ${list.length ? list.map(u => {
      const n = (u.staff || []).length;
      return `<div class="panel">
        <div class="panel-head"><div><h2>${esc(u.title)}</h2><div class="muted small">Update · open until ${fmtDateTime(u.closes_at)}</div></div>
          ${u.require_staff && u.ack ? `<div class="row"><a class="btn wa" target="_blank" rel="noopener" href="${esc(waStaffHref(u.title, "updates"))}">${ICON.wa}Share on WhatsApp</a><button class="btn ghost" data-copy="1">${ICON.copy}Copy link</button></div>` : ""}</div>
        ${!u.require_staff ? `<p class="muted">Managers only: no staff sign-off needed for this update.</p>`
          : !u.ack ? `<div class="empty" style="padding:14px 0">Acknowledge this update first, then share it with your staff.<div style="margin-top:12px"><button class="btn" data-goupd="1">Go to Updates</button></div></div>`
          : `<div class="row" style="gap:10px;margin-bottom:10px"><b style="font-size:22px">${n}</b><span class="muted">of ${total || "?"} staff confirmed${total && n >= total ? " ✓" : ""}</span>
              ${total ? `<div class="meter tan" style="flex:1;min-width:120px"><i style="width:${Math.min(100, pct(n, total))}%"></i></div>` : ""}</div>
            <h3 style="margin:6px 0 8px">Who has confirmed <span class="muted">(${n})</span></h3>${staffListHTML(u.staff || [])}`}
      </div>`;
    }).join("") : `<div class="panel empty"><h2 style="margin-bottom:6px">No open updates</h2>When a new update needs your staff's confirmation, it appears here.</div>`}`;
  bindStaffSeg();
  $("#content").querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(staffLink("updates")));
  $("#content").querySelectorAll("[data-goupd]").forEach(b => b.onclick = () => go("updates"));
}
function renderUpdatesView() {
  const list = D.updates || [], total = D.store.total_staff || 0;
  $("#content").innerHTML = `
    <div class="top"><div><h1>Updates</h1><p>${esc(D.store.name)} · recipe changes, training and announcements</p></div><span class="live"><i></i>Live</span></div>
    ${list.length ? `<div class="panel">${list.map(u => updateCard(u, `<div class="upd-actions">
      ${u.ack ? `<span class="chip ok">Acknowledged ${fmtDateTime(u.ack)}</span>${u.require_staff ? `<button class="btn ghost sm" data-seestaff="1">${u.staff_n} of ${total || "?"} staff confirmed</button><a class="btn wa sm" target="_blank" rel="noopener" href="${esc(waStaffHref(u.title, "updates"))}">${ICON.wa}Share with staff</a>` : `<span class="muted small">Managers only, no staff sign-off needed</span>`}`
        : `<button class="btn tan" data-uack="${u.id}">${ICON.check}I acknowledge this update</button>`}
    </div>`)).join("")}</div>` : `<div class="panel empty"><h2 style="margin-bottom:6px">No open updates</h2>New recipe changes and announcements will appear here.</div>`}`;
  $("#content").querySelectorAll("[data-seestaff]").forEach(b => b.onclick = () => { staffMode = "updates"; go("staff"); });
  $("#content").querySelectorAll("[data-uack]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    const id = +b.dataset.uack, u = (D.updates || []).find(x => x.id === id);
    const { data: at, error } = await sb.rpc("hb_store_ack_update", { p_token: token, p_update_id: id });
    if (error) { toast(errMsg(error), "bad"); return load(); }
    if (u) u.ack = at || new Date().toISOString();   // show it straight away even if the refresh below is slow
    toast(u && !u.require_staff ? "Thank you! This update is acknowledged." : "Thank you! Now share it with your staff.");
    livePing(["hb-admin"], "update-ack"); if (!(await load())) render();
  });
}

// ---------- views ----------
function render() {
  const w = D.week;
  if (view === "updates") return renderUpdatesView();
  if (view === "staff" && staffMode === "updates") return renderStaffUpdates();
  const nu = pendingUpdates().length;
  const updBanner = nu ? `<div class="panel row" style="justify-content:space-between;border-color:var(--amber)"><div class="row" style="gap:12px;flex-wrap:nowrap"><span class="upd-icon">${ICON.bell}</span><div><h2>${nu} new update${nu > 1 ? "s" : ""}</h2><div class="muted small">Please read and acknowledge.</div></div></div><button class="btn" id="toUpdates">Open updates</button></div>` : "";
  if (!w) {
    $("#content").innerHTML = `<div class="top"><div><h1>This week</h1><p>${esc(D.store.name)}</p></div><span class="live"><i></i>Live</span></div>
      ${view === "staff" ? staffSeg() : updBanner}<div class="panel empty"><h2 style="margin-bottom:6px">No hero products yet</h2>This page updates by itself when the admin publishes this week's heroes.</div>`;
    if ($("#toUpdates")) $("#toUpdates").onclick = () => go("updates");
    bindStaffSeg();
    return;
  }
  const total = D.store.total_staff || 0, n = D.staff.length;
  if (view === "heroes") {
    $("#content").innerHTML = `
      <div class="top"><div><h1>This week's heroes</h1><p>${esc(D.store.name)} · ${fmtDate(w.start_date)} – ${fmtDate(w.end_date)}</p></div><span class="live"><i></i>Live</span></div>
      ${updBanner}
      <div class="hero-banner">
        <div><div class="eyebrow">Hero week</div><div class="wk">${esc(w.title)}</div><div class="dates">${D.products.length} hero product${D.products.length === 1 ? "" : "s"}</div></div>
        <div>${D.ack ? `<div class="ack-done">${ICON.check.replace("<svg", '<svg width="18" height="18"')} Acknowledged ${fmtDateTime(D.ack)}</div>` : `<button class="btn tan big" id="ackBtn">${ICON.check}I acknowledge these heroes</button>`}</div>
      </div>
      <div class="panel">${productCards(D.products)}</div>
      ${D.ack ? `<div class="panel row" style="justify-content:space-between"><div><h2>Next: brief your staff</h2><div class="muted small">${n} of ${total || "?"} staff have confirmed.</div></div><button class="btn" id="toStaff">Staff sign-off</button></div>` : ""}`;
  } else {
    $("#content").innerHTML = `
      <div class="top"><div><h1>Staff sign-off</h1><p>Hero products · ${esc(w.title)}</p></div><span class="live"><i></i>Live</span></div>
      ${staffSeg()}
      ${!D.ack ? `<div class="panel empty"><h2 style="margin-bottom:6px">Acknowledge first</h2>Review this week's heroes and tap <b>I acknowledge</b>. Then you can share the link with your staff.<div style="margin-top:16px"><button class="btn" id="toHeroes">Go to this week's heroes</button></div></div>` : `
      <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <div class="kpi"><div class="k-label"><span class="dot" style="background:var(--tan)"></span>Staff aware</div>
          <div class="k-value">${n}<small> / ${total || "—"}</small></div>
          ${total ? `<div class="meter tan"><i style="width:${Math.min(100, pct(n, total))}%"></i></div><div class="k-foot">${n >= total ? "All staff are aware ✓" : `${total - n} still to go`}</div>` : `<div class="k-foot" style="color:var(--amber)">Set your total staff so we can track progress.</div>`}
        </div>
        <div class="kpi"><div class="k-label"><span class="dot" style="background:var(--teal)"></span>Total staff in store</div>
          <div class="row" style="margin-top:12px;flex-wrap:nowrap"><input type="number" id="totalIn" min="0" max="500" inputmode="numeric" value="${total || ""}" placeholder="0" style="max-width:110px"><button class="btn" id="saveTotal">Save</button></div>
          <div class="k-foot">Everyone who works in this store.</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div><h2>Share with your staff</h2><div class="muted small">Send the link to your store WhatsApp group. Each staff member opens it and confirms.</div></div>
          <div class="row"><a class="btn wa" id="waBtn" target="_blank" rel="noopener">${ICON.wa}Share on WhatsApp</a><button class="btn ghost" id="copyBtn">${ICON.copy}Copy link</button></div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Who has confirmed this week's heroes <span class="muted">(${n})</span></h2></div>
        ${staffListHTML(D.staff)}
      </div>`}`;
  }

  if ($("#ackBtn")) $("#ackBtn").onclick = async () => {
    $("#ackBtn").disabled = true;
    const { data: at, error } = await sb.rpc("hb_store_ack", { p_token: token, p_week_id: w.id });
    if (error) { toast(errMsg(error), "bad"); return load(); }
    D.ack = at || new Date().toISOString();
    toast("Thank you! Now share the link with your staff.");
    livePing(["hb-admin"], "ack"); await load(); staffMode = "heroes"; go("staff");
  };
  if ($("#toStaff")) $("#toStaff").onclick = () => { staffMode = "heroes"; go("staff"); };
  if ($("#toUpdates")) $("#toUpdates").onclick = () => go("updates");
  if ($("#toHeroes")) $("#toHeroes").onclick = () => go("heroes");
  bindStaffSeg();
  if ($("#waBtn")) {
    $("#waBtn").href = waStaffHref(`${w.title} – this week's heroes`, "heroes");
    $("#copyBtn").onclick = () => copyText(staffLink("heroes"));
    $("#saveTotal").onclick = async () => {
      const v = parseInt($("#totalIn").value || "0", 10);
      $("#totalIn").blur();
      const { error } = await sb.rpc("hb_store_set_staff", { p_token: token, p_total: isNaN(v) ? 0 : v });
      if (error) return toast(errMsg(error), "bad");
      toast("Saved"); livePing(["hb-admin"], "staff"); load();
    };
  }
}
start();
</script>
</body>
</html>
