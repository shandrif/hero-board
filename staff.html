<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Board · This Week's Heroes</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div id="splash" role="status" aria-label="Loading">
  <div class="sp-box"><img class="sp-logo" src="icon.svg" alt=""><div class="sp-name">Hero Board</div><div class="sp-bar"><i></i></div></div>
</div>
<div id="staffShell">
  <header class="staff-top"><div class="brand"><img class="logo" src="icon.svg" alt=""><div><b>Hero Board</b><small id="hStore">This week's heroes</small></div></div></header>
  <main class="staff-main">
    <div id="content"></div>
  </main>
</div>
<script src="motion.js"></script>
<script>
const P = new URLSearchParams(location.search), W = (P.get("w") || "").trim(), K = (P.get("k") || "").trim();
const doneKey = `hb_staff_done_${W}_${K}`;
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let storeCode = null;

async function load() {
  if (!UUID.test(W) || !UUID.test(K)) return fail("LINK_INVALID");
  const { data, error } = await sb.rpc("hb_staff_view", { p_week_token: W, p_key: K });
  if (error) return fail(error.message);
  storeCode = data.store.code;
  $("#hStore").textContent = data.store.name;
  if (!data.is_current) return fail("LINK_OLD");
  const done = storageGet(doneKey);
  $("#content").innerHTML = `
    <div class="hero-banner"><div>
      <div class="eyebrow">This week's heroes · ${esc(data.store.name)}</div>
      <div class="wk">${esc(data.week.title)}</div><div class="dates">${fmtDate(data.week.start_date)} – ${fmtDate(data.week.end_date)}</div></div></div>
    <div class="panel">${productCards(data.products)}</div>
    <div class="panel" id="formPanel">${done ? doneHTML(JSON.parse(done)) : formHTML()}</div>`;
  bindForm(); hideSplash(); animateEnter($("#content"));
}
function formHTML() {
  return `
      <h2 style="margin-bottom:4px">Confirm you know this week's heroes</h2>
      <p class="muted small" style="margin:0 0 14px">Read the products above, then enter your details.</p>
      <form id="f">
        <div class="field"><label for="fName">Your full name</label><input id="fName" autocomplete="name" required maxlength="80"></div>
        <div class="field"><label for="fId">Employee ID</label><input id="fId" required maxlength="30" autocapitalize="characters"></div>
        <div class="err" id="fErr"></div>
        <button class="btn teal big block" id="fBtn" type="submit" style="margin-top:6px">${ICON.check}I'm aware of these heroes</button>
      </form>`;
}
function bindForm() {
  const f = $("#f");
  if (f) f.onsubmit = async e => {
    e.preventDefault(); $("#fErr").textContent = ""; $("#fBtn").disabled = true;
    const { data: r, error } = await sb.rpc("hb_staff_ack", { p_week_token: W, p_key: K, p_employee_id: $("#fId").value, p_name: $("#fName").value });
    if (error) { $("#fBtn").disabled = false; return ($("#fErr").textContent = errMsg(error)); }
    storageSet(doneKey, JSON.stringify(r));
    if (!r.already) livePing(["hb-admin", "hb-store-" + storeCode], "staff");
    $("#formPanel").innerHTML = doneHTML(r); bindForm();
  };
  const other = $("#otherBtn");
  if (other) other.onclick = () => { storageSet(doneKey, null); $("#formPanel").innerHTML = formHTML(); bindForm(); $("#fName").focus(); };
}
function doneHTML(r) {
  return `<div style="text-align:center;padding:10px 0">
    <div class="big-check">${ICON.check.replace("<svg", '<svg width="30" height="30"')}</div>
    <h2>Thank you, ${esc(r.name)}!</h2>
    <p class="muted">${r.already ? "You had already confirmed" : "Confirmed"} on ${fmtDateTime(r.acked_at)}.</p>
    <button class="btn ghost" id="otherBtn" style="margin-top:6px">Confirm for another staff member</button></div>`;
}
function fail(m) {
  $("#content").innerHTML = `<div class="panel empty"><h2 style="margin-bottom:6px">Link not working</h2>${esc(errMsg({ message: m }))}</div>`;
  hideSplash();
}
load();
</script>
</body>
</html>
