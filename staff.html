<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Board · Heroes and Updates</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="style.css?v=22">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=22"></script>
<script src="common.js?v=22"></script>
</head>
<body>
<div id="splash" role="status" aria-label="Loading">
  <div class="sp-box"><img class="sp-logo" src="icon.svg" alt=""><div class="sp-name">Hero Board</div><div class="sp-bar"><i></i></div></div>
</div>
<div id="staffShell">
  <header class="staff-top"><div class="brand"><img class="logo" src="icon.svg" alt=""><div><b>Hero Board</b><small id="hStore">This week's heroes</small></div></div></header>
  <main class="staff-main">
    <div id="content"></div>
  </main>
</div>
<script src="motion.js?v=22"></script>
<script>
// One link per store: staff.html?k=<store link key>[&v=heroes|updates]
// Two SEPARATE sections, each with its own confirmation: this week's hero products, and open updates.
// Confirming one never counts as confirming the other. Older links (?w=…&k=…) keep working.
const P = new URLSearchParams(location.search), K = (P.get("k") || "").trim();
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const meKey = `hb_staff_me_${K}`;      // { name, employee_id, week, updates: [] } for this phone
let D = null, storeCode = null, lastOther = null;
// old links (?w=…) were always for the hero week
let sec = P.get("v") === "updates" ? "updates" : P.get("v") === "heroes" ? "heroes" : P.has("w") ? "heroes" : null;
// same cleaning as the database: Arabic digits -> 0-9, letters and digits only, upper case
const normId = v => String(v || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^A-Za-z0-9]/g, "").toUpperCase();

const readMe = () => { try { return JSON.parse(storageGet(meKey) || "null"); } catch { return null; } };
const hasWeek = () => !!(D.week && D.products.length);
// staff can confirm only after their store manager has acknowledged (mgr_ack false = not yet)
const mgrOk = x => !!x && x.mgr_ack !== false;
const okUpdates = () => D.updates.filter(mgrOk);
const weekPending = me => hasWeek() && mgrOk(D.week) && (!me || me.week !== D.week.id);
const updPending = me => okUpdates().filter(u => !me || !(me.updates || []).includes(u.id));
function waitHTML(what) {
  return `<div class="panel empty"><h2 style="margin-bottom:6px">Waiting for your manager</h2>Your store manager hasn't confirmed ${what} yet.<br>Ask your manager to open Hero Board and tap <b>I acknowledge</b>, then open this link again.<div style="margin-top:14px"><button class="btn" id="waitRetry">Check again</button></div></div>`;
}

async function load() {
  if (!UUID.test(K)) return fail("LINK_INVALID");
  const { data, error } = await sb.rpc("hb_staff_page", { p_key: K });
  if (error) return fail(error.message, /LINK_INVALID/.test(error.message) ? null : load);
  D = data; storeCode = data.store.code;
  HB_MEDIA = { auth: { link_key: K }, label: `${data.store.name} · Staff` };
  $("#hStore").textContent = data.store.name;
  if (!hasWeek() && !D.updates.length) {
    $("#content").innerHTML = `<div class="panel empty"><h2 style="margin-bottom:6px">Nothing to confirm right now</h2>This page shows this week's hero products and any updates for ${esc(data.store.name)}. Check back when your manager shares something new.</div>`;
    hideSplash(); return;
  }
  if (sec === "updates" && !D.updates.length) sec = null;
  if (sec === "heroes" && !hasWeek()) sec = null;
  if (!sec) { const me = readMe(); sec = updPending(me).length ? "updates" : weekPending(me) ? "heroes" : hasWeek() && mgrOk(D.week) ? "heroes" : okUpdates().length ? "updates" : hasWeek() ? "heroes" : "updates"; }
  draw(); hideSplash();
}
function draw() {
  const me = readMe(), nu = updPending(me).length, wp = weekPending(me);
  const tabs = hasWeek() && D.updates.length ? `<div class="seg" id="sec" role="tablist" style="margin-bottom:14px">
      <button data-s="heroes" class="${sec === "heroes" ? "on" : ""}">Hero products${wp ? " •" : ""}</button>
      <button data-s="updates" class="${sec === "updates" ? "on" : ""}">Updates${nu ? ` (${nu})` : ""}</button></div>` : "";
  const ups = okUpdates(), locked = D.updates.length - ups.length;
  const waiting = sec === "updates" ? !ups.length : !mgrOk(D.week);
  $("#content").innerHTML = tabs + (waiting ? waitHTML(sec === "updates" ? (D.updates.length > 1 ? "these updates" : "this update") : "this week's hero products") : sec === "updates" ? `
    <div class="panel"><div class="panel-head"><h2>Updates for you <span class="muted">(${ups.length})</span></h2></div>${ups.map(u => updateCard(u)).join("")}
      ${locked ? `<p class="muted small" style="margin:10px 0 0">${locked} more update${locked > 1 ? "s" : ""} will appear here after your manager confirms ${locked > 1 ? "them" : "it"}.</p>` : ""}</div>
    <div class="panel" id="formPanel"></div>` : `
    <div class="hero-banner"><div>
      <div class="eyebrow">This week's hero products · ${esc(D.store.name)}</div>
      <div class="wk">${esc(D.week.title)}</div><div class="dates">${fmtDate(D.week.start_date)} – ${fmtDate(D.week.end_date)}</div></div></div>
    <div class="panel">${productCards(D.products)}</div>
    <div class="panel" id="formPanel"></div>`);
  document.querySelectorAll("#sec button").forEach(b => b.onclick = () => { sec = b.dataset.s; draw(); window.scrollTo(0, 0); });
  const wr = $("#waitRetry"); if (wr) wr.onclick = () => { wr.disabled = true; load(); };
  if (!waiting) drawForm(); animateEnter($("#content"));
}
function drawForm(forceNew) {
  const me = readMe(), known = me && !forceNew;
  const pending = sec === "updates" ? updPending(forceNew ? null : me).length > 0 : weekPending(forceNew ? null : me);
  if (!pending && known) { $("#formPanel").innerHTML = doneHTML(me); bindForm(); return; }
  const what = sec === "updates" ? (okUpdates().length > 1 ? "these updates" : "this update") : "this week's hero products";
  const hasVideo = sec === "updates" && okUpdates().some(u => (u.media || []).some(m => m.kind === "video"));
  $("#formPanel").innerHTML = `
      <h2 style="margin-bottom:4px">Confirm you know ${what}</h2>
      ${known ? `<p class="small" style="margin:0 0 10px;padding:8px 10px;border-radius:10px;background:var(--amber-soft)">Filled in for <b>${esc(me.name)}</b> (${esc(me.employee_id)}). <a href="#" id="notMe">Not you? Enter your own details</a></p>` : ""}
      <p class="muted small" style="margin:0 0 14px">${sec === "updates" ? `Read the update${hasVideo ? " and watch the video" : ""} above, then enter your details.` : "Read the hero products above, then enter your details."}</p>
      <form id="f">
        <div class="field"><label for="fName">Your full name</label><input id="fName" autocomplete="name" required maxlength="80" value="${known ? esc(me.name) : ""}"></div>
        <div class="field"><label for="fId">Employee ID</label><input id="fId" required maxlength="30" autocapitalize="characters" autocomplete="off" placeholder="e.g. 7866" value="${known ? esc(me.employee_id) : ""}"></div>
        <div class="err" id="fErr"></div>
        <button class="btn teal big block" id="fBtn" type="submit" style="margin-top:6px">${ICON.check}${sec === "updates" ? `I'm aware of ${what}` : "I'm aware of these heroes"}</button>
      </form>`;
  bindForm(forceNew);
  const nm = $("#notMe"); if (nm) nm.onclick = e => { e.preventDefault(); drawForm(true); $("#fName").focus(); };
}
function bindForm(forceNew) {
  const f = $("#f");
  if (f) f.onsubmit = async e => {
    e.preventDefault(); $("#fErr").textContent = ""; $("#fBtn").disabled = true;
    let me0 = forceNew ? null : readMe();
    if (me0 && normId($("#fId").value) !== normId(me0.employee_id)) me0 = null;   // a different person: confirm everything shown
    const weekId = sec === "heroes" && D.week ? D.week.id : null;
    const ids = sec === "updates" ? updPending(me0).map(u => u.id) : [];
    const { data: r, error } = await sb.rpc("hb_staff_confirm", { p_key: K, p_employee_id: $("#fId").value, p_name: $("#fName").value, p_week_id: weekId, p_update_ids: ids });
    if (error) {
      if (/WEEK_CHANGED|UPDATE_CLOSED|RELOAD|MANAGER_FIRST/.test(error.message)) { toast(errMsg(error), "bad"); sec = null; return load(); }
      $("#fBtn").disabled = false; return ($("#fErr").textContent = errMsg(error));
    }
    lastOther = r.other_name || null;
    const prev = readMe(), same = prev && prev.employee_id === r.employee_id;
    const me = { name: r.name, employee_id: r.employee_id, acked_at: r.acked_at,
      week: r.week ? D.week.id : (same ? prev.week : null),
      updates: [...new Set([...(same ? prev.updates || [] : []), ...(r.updates || [])])] };
    storageSet(meKey, JSON.stringify(me));
    livePing(["hb-admin", "hb-store-" + storeCode], "staff");
    draw();
  };
  const other = $("#otherBtn");
  if (other) other.onclick = () => { lastOther = null; drawForm(true); $("#fName").focus(); };
}
function doneHTML(me) {
  const other = sec === "updates" ? (weekPending(me) ? "heroes" : null) : (updPending(me).length ? "updates" : null);
  return `<div style="text-align:center;padding:10px 0">
    <div class="big-check">${ICON.check.replace("<svg", '<svg width="30" height="30"')}</div>
    <h2>Thank you, ${esc(me.name)}!</h2>
    <p class="muted">You confirmed ${sec === "updates" ? "the update" : "this week's hero products"}.</p>
    ${lastOther ? `<p class="small" style="padding:8px 10px;border-radius:10px;background:var(--amber-soft);text-align:left">Note: Employee ID <b>${esc(me.employee_id)}</b> was already confirmed under the name <b>${esc(lastOther)}</b>. If that isn't you, please check your Employee ID and confirm again.</p>` : ""}
    ${other ? `<button class="btn" id="goOther" style="margin:6px 6px 0">Next: confirm ${other === "updates" ? "the updates" : "this week's hero products"}</button>` : ""}
    <button class="btn ghost" id="otherBtn" style="margin-top:6px">Confirm for another staff member</button></div>`;
}
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("#goOther")) { lastOther = null; sec = sec === "updates" ? "heroes" : "updates"; draw(); window.scrollTo(0, 0); } });
function fail(m, retry) {
  $("#content").innerHTML = `<div class="panel empty"><h2 style="margin-bottom:6px">${retry ? "Couldn't load" : "Link not working"}</h2>${esc(errMsg({ message: m }))}${retry ? `<div style="margin-top:14px"><button class="btn" id="retryBtn">Try again</button></div>` : ""}</div>`;
  if (retry) $("#retryBtn").onclick = () => { $("#content").innerHTML = `<p class="empty">Loading…</p>`; retry(); };
  hideSplash();
}
load();
</script>
</body>
</html>
